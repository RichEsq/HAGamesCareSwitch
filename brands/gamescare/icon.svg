<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <!-- GamesCare circle mark, recreated as vector for the home-assistant/brands repo. -->
  <defs>
    <!-- One quadrant (top-right); the other three are rotations. Cross gap is 132 px wide. -->
    <path id="quadrant" d="M 322 29.4 A 236 236 0 0 1 482.6 190 L 322 190 Z" fill="#A6DEDE"/>
    <polygon id="arrow" points="256,122 231,158 281,158" fill="#E8903A"/>
  </defs>

  <use xlink:href="#quadrant"/>
  <use xlink:href="#quadrant" transform="rotate(90 256 256)"/>
  <use xlink:href="#quadrant" transform="rotate(180 256 256)"/>
  <use xlink:href="#quadrant" transform="rotate(270 256 256)"/>

  <circle cx="256" cy="256" r="54" fill="#7FCFCF"/>

  <use xlink:href="#arrow"/>
  <use xlink:href="#arrow" transform="rotate(90 256 256)"/>
  <use xlink:href="#arrow" transform="rotate(180 256 256)"/>
  <use xlink:href="#arrow" transform="rotate(270 256 256)"/>
</svg>
