name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build zip and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python3 -c 'import json;print(json.load(open("custom_components/gamescare/manifest.json"))["version"])')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match manifest version $VERSION" >&2
            exit 1
          fi

      - name: Build gamescare.zip
        run: |
          cd custom_components/gamescare
          zip -r ../../gamescare.zip . -x '__pycache__/*' '*.pyc'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: gamescare.zip
          generate_release_notes: true
